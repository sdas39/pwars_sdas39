function useSpeech(region) {

    setSpeaking(false);
  }, []);
  const listen = useCallback(() => {
    if (!supported) return;
    try {
      const synth = window.speechSynthesis;
      synth.cancel();
      const mine = ++run.current;
      const lines = GUIDE[region.id];
      setSpeaking(true);
      lines.forEach((text, i) => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-IN"; u.rate = 0.9; u.pitch = 1;

        u.onend = finish; u.onerror = finish;
        synth.speak(u);
      });
    } catch (e) { setSpeaking(false); }
  }, [supported, region.id]);

      <div className="mb-1 flex items-center justify-between text-xs text-[var(--muted)]">
        <span className="flex items-center gap-1.5"><Icon name={icon} size={13} />{label}</span>
        <span className="tnum text-[var(--text)]">{free} <span className="text-[var(--muted)]">{unit} free of {total}</span></span>
      </div>
      <div className="h-1.5 overflow-hidden rounded-full bg-white/10" role="img" aria-label={label + " " + freePct + "% free"}>
        <div className={"h-full rounded-full " + tone} style={{ width: freePct + "%" }} />
      </div>
    </div>
  );
}

function RainChart({ data }) {
  const max = Math.max(...data, 10);
  return (
    <svg viewBox="0 0 252 92" className="w-full max-w-[300px]" role="img" aria-label="Rainfall per hour, last 12 hours">
      <text x="0" y="9" fontSize="9" fill="var(--muted)">mm/h · max {max}</text>
      {[0.5, 1].map((f) => <line key={f} x1="0" x2="252" y1={72 - 56 * f} y2={72 - 56 * f} stroke="var(--line)" strokeWidth="1" />)}
      {data.map((v, i) => {
        const h = (v / max) * 56;
        const last = i === data.length - 1;
        return <rect key={i} x={i * 21 + 2} y={72 - h} width="15" height={h} rx="2" fill={last ? "var(--teal)" : "#2d5f68"} />;
      })}
      <text x="2" y="86" fontSize="9" fill="var(--muted)">-12 h</text>
      <text x="250" y="86" fontSize="9" textAnchor="end" fill="var(--muted)">now</text>
    </svg>
  );
}

function Toasts({ items, term }) {
  return (
    <div className="pointer-events-none fixed left-0 right-0 z-[80] flex flex-col items-center gap-2 px-4" style={{ bottom: "calc(env(safe-area-inset-bottom, 0px) + 84px)" }} aria-live="polite">
      {items.map((x) => (
        <div key={x.id} className={term ? "border border-amber-400 bg-black px-3 py-2 font-mono text-xs text-amber-300" : "rounded-md border border-[var(--line)] bg-[var(--panel-2)] px-3.5 py-2 text-sm shadow-xl"}>
          {term ? "> " + x.msg : x.msg}
        </div>
      ))}
    </div>
  );
}

/* ---------- Alert banner ---------- */
function ListenButton({ speech, term, className = "" }) {
  if (!speech || !speech.supported) return null;
  const on = speech.speaking;
  const click = on ? speech.stop : speech.listen;
  if (term) return <button onClick={click} aria-pressed={on} className="border border-amber-400 px-2 py-1">[{on ? "STOP AUDIO" : "LISTEN"}]</button>;
  return (
    <button onClick={click} aria-pressed={on} className={"flex items-center gap-1.5 " + className}>
      <Icon name={on ? "stop" : "volume"} size={15} />{on ? "Stop audio" : "Listen to Safety Guide"}
    </button>
  );
}

function AlertBanner({ alert, term, onAck, onRoutes, speech }) {
  if (!alert) return null;
  if (term) {
    return (
      <div role="alert" className="mb-3 border-2 border-amber-400 p-3 font-mono text-[13px]">
        <div className="blink font-semibold">!! INCOMING ALERT !! (SIMULATED)</div>
        <div className="mt-1 font-semibold">{alert.title}</div>
        <div className="mt-1">{alert.body}</div>
        <div className="mt-1">{alert.eta}</div>
        <div className="mt-2 flex gap-3"><ListenButton speech={speech} term /><button className="border border-amber-400 px-2 py-1" onClick={onRoutes}>[ROADS]</button><button className="border border-amber-400 px-2 py-1" onClick={onAck}>[ACK]</button></div>
      </div>
    );
  }
  return (
    <div role="alert" className="pulse-sos mb-4 rounded-lg border border-red-500/60 bg-gradient-to-r from-red-950 to-[#2a0f12] p-4">
      <div className="flex flex-wrap items-start gap-3">
        <div className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-500 text-white"><Icon name="siren" size={20} /></div>
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <span className="font-display text-base font-semibold tracking-wide text-red-100">{alert.title}</span>
            <span className="rounded border border-red-300/40 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wider text-red-200">Simulated demo alert</span>
          </div>
          <p className="mt-1 max-w-3xl text-sm text-red-100/90">{alert.body}</p>
          <p className="mt-1 flex items-center gap-1.5 text-xs text-red-200/80"><Icon name="clock" size={13} />{alert.eta} · received {ago(alert.ts)}</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <ListenButton speech={speech} className="rounded-md bg-white px-3 py-1.5 text-sm font-semibold text-red-900 hover:bg-red-100" />
          <button onClick={onRoutes} className="rounded-md bg-red-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-400">View evacuation routes</button>

        </div>
      </div>
    </div>
  );
}

function Modal({ children, onClose, term, label, wide }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-[70] flex items-end justify-center bg-black/70 p-0 sm:items-center sm:p-4" onMouseDown={(e) => e.target === e.currentTarget && onClose()} role="dialog" aria-modal="true" aria-label={label}>
      <div className={"max-h-[92vh] w-full overflow-y-auto " + (wide ? "sm:max-w-3xl " : "sm:max-w-md ") + (term ? "border-2 border-amber-400 bg-black font-mono text-amber-300" : "rounded-t-xl border border-[var(--line)] bg-[var(--panel)] sm:rounded-xl")} style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>{children}</div>
    </div>
  );
}

  const lab = term ? "mb-1 block text-xs uppercase" : "mb-1 block text-xs font-medium text-[var(--muted)]";
  return (
    <Modal onClose={onClose} term={term} label="Report ground update">
      <form onSubmit={(e) => { e.preventDefault(); if (valid) onSubmit({ target, newName: newName.trim(), status, note: note.trim(), by }); }} className="grid gap-3 p-4">
        <div className="flex items-center justify-between">
          <h2 className={term ? "font-semibold" : "font-display text-lg font-semibold"}>{term ? "REPORT GROUND UPDATE" : "Report ground update"}</h2>
          <button type="button" onClick={onClose} aria-label="Close" className="p-1"><Icon name="x" size={18} /></button>
        </div>
        <div><label htmlFor="rp-target" className={lab}>Location</label>
          <select id="rp-target" value={target} onChange={(e) => setTarget(e.target.value)} className={field}>

        {target === "__new" && <div><label htmlFor="rp-new" className={lab}>Name of road or crossing</label><input id="rp-new" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Lalmati Bridge approach" className={field} /></div>}
        <div><label htmlFor="rp-status" className={lab}>What do you see?</label>
          <select id="rp-status" value={status} onChange={(e) => setStatus(e.target.value)} className={field}>{STATUS_LIST.map((s) => <option key={s}>{s}</option>)}</select></div>
        <div><label htmlFor="rp-note" className={lab}>Details (depth, vehicles passing, hazards)</label>

        <button disabled={!valid} className={term ? "border border-amber-400 px-3 py-2 font-semibold disabled:opacity-40" : "rounded-md bg-[var(--teal)] px-3 py-2.5 font-semibold text-[#06201e] disabled:opacity-40"}>{term ? "[SUBMIT UPDATE]" : "Submit update"}</button>

/* ---------- Responder triage feed ---------- */
function TriageTab({ items, regionId, onAdvance, onFocusSos, term }) {
  const [scope, setScope] = useState("region");
  const list = items.filter((i) => scope === "all" || i.regionId === regionId)
    .map((i) => ({ ...i, pr: priorityOf(i) }))
    .sort((a, b) => (a.status === "RESOLVED") - (b.status === "RESOLVED") || PRANK[a.pr] - PRANK[b.pr] || b.ts - a.ts);
  const count = (s) => list.filter((i) => (s === "ACTIVE" ? i.status === "DISPATCHED" || i.status === "ON SCENE" : i.status === s)).length;
  const reg = (id) => REGIONS.find((r) => r.id === id);

  if (term) {
    return (
      <div className="font-mono text-[13px]">
        <div className="mb-2">TRIAGE FEED · NEW:{count("NEW")} ACTIVE:{count("ACTIVE")} DONE:{count("RESOLVED")}</div>
        <div className="mb-2 flex gap-3"><button onClick={() => setScope("region")} className={scope === "region" ? "underline" : ""}>[THIS REGION]</button><button onClick={() => setScope("all")} className={scope === "all" ? "underline" : ""}>[ALL NE]</button></div>
        {list.map((i) => (
          <div key={i.id} className="mb-3 border-t border-amber-400/40 pt-2">
            <div>{i.id} {i.pr} {i.status} {ago(i.ts, true)}</div>
            <div className="break-all">{buildSms({ code: reg(i.regionId).code, loc: i.loc, type: i.type, people: i.people, med: i.med, flags: i.flags, lang: i.lang })}</div>
            {NEXT[i.status] && <button className="mt-1 border border-amber-400 px-2 py-0.5" onClick={() => onAdvance(i.id)}>[{NEXT[i.status][1].toUpperCase()}]</button>}
          </div>
        ))}
      </div>
    );
  }
  return (
    <div className="grid gap-3">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex gap-2 text-xs">
          {[["NEW", count("NEW"), "text-red-300 border-red-500/40"], ["ACTIVE", count("ACTIVE"), "text-amber-300 border-amber-500/40"], ["DONE", count("RESOLVED"), "text-emerald-300 border-emerald-500/40"]].map(([l, n, c]) => (
            <span key={l} className={"rounded border px-2 py-1 font-semibold " + c}><span className="tnum">{n}</span> {l}</span>

        <div className="inline-flex overflow-hidden rounded-md border border-[var(--line)] text-xs" role="group" aria-label="Feed scope">

            <button key={v} onClick={() => setScope(v)} aria-pressed={scope === v} className={"px-3 py-1.5 " + (scope === v ? "bg-[var(--teal)] font-semibold text-[#06201e]" : "bg-[var(--panel)] text-[var(--muted)]")}>{l}</button>
          ))}
        </div>
      </div>
      {list.length === 0 && <p className="rounded-lg border border-dashed border-[var(--line)] p-6 text-center text-sm text-[var(--muted)]">No requests in this scope. Send an SOS from the citizen panel and it will appear here.</p>}
      {list.map((i) => {
        const r = reg(i.regionId);

        return (
          <article key={i.id} className={"rounded-lg border bg-[var(--panel)] p-4 " + (i.fresh ? "border-[var(--teal)]" : "border-[var(--line)]") + (done ? " opacity-60" : "")}>
            <div className="flex flex-wrap items-center justify-between gap-2">

                <span className={"rounded border px-2 py-0.5 text-[11px] font-semibold tracking-wide " + PTONE[i.pr]}>{i.pr}</span>

/* ---------- Offline rescue QR ---------- */
function QrCard({ qr, sms, term }) {
  if (!qr) return <p className="mt-3 text-sm text-red-300">This payload is too long for a QR code. Remove a flag or lower the people count.</p>;
  const q = 4, n = qr.size + q * 2;
  let d = "";
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.modules[y][x]) d += "M" + (x + q) + " " + (y + q) + "h1v1h-1z";
  return (
    <div className={"mt-3 p-3 " + (term ? "border border-amber-400" : "rounded-lg border border-[var(--line)] bg-[var(--panel-2)]")}>
      <div className="mx-auto w-full max-w-[300px] bg-white p-1">
        <svg viewBox={"0 0 " + n + " " + n} shapeRendering="crispEdges" role="img" aria-label="Offline rescue QR code" className="block w-full">
          <rect width={n} height={n} fill="#ffffff" />
          <path d={d} fill="#000000" />
        </svg>
      </div>
      <p className="mt-3 text-center text-sm font-semibold">Zero-Signal Mode: Volunteers or rescue drones can scan this screen offline</p>
      <p className={"mt-1 text-center text-xs " + (term ? "" : "text-[var(--muted)]")}>Raise screen brightness and hold the phone steady. Generated on this device, no internet used.</p>
      <p className={"mt-2 break-all text-center font-mono text-[11px] " + (term ? "" : "text-[var(--teal)]")}>{sms}</p>
    </div>
  );
}

/* ---------- SOS drawer ---------- */
function SosPanel({ region, term, onClose, onBroadcast, onViewFeed }) {
  const [type, setType] = useState("FLOOD");
  const [people, setPeople] = useState(4);
  const [lang, setLang] = useState("en");
  const [med, setMed] = useState(false);
  const [sent, setSent] = useState(null);
  const [copied, setCopied] = useState(false);
  const smsRef = useRef(null);
  const [flags, setFlags] = useState([]);
  const [showQr, setShowQr] = useState(false);
  const withMed = med || type === "MED";
  const flagCodes = FLAGS.filter((f) => flags.includes(f.id)).map((f) => f.id);
  const flagLabels = FLAGS.filter((f) => flags.includes(f.id)).map((f) => f.label);
  const sms = buildSms({ code: region.code, loc: region.coords.txt, type, people, med: withMed, flags: flagCodes, lang: LANGS.find((l) => l.id === lang).tag });
  const qr = useMemo(() => (showQr ? makeQR(sms) : null), [showQr, sms]);
  const toggleFlag = (id) => setFlags((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));
  const P = PHRASE[lang];
  const langMeta = LANGS.find((l) => l.id === lang);

  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);

  const doCopy = async () => {
    const ok = await copyText(sms, smsRef.current);
    setCopied(ok ? true : "manual");
    setTimeout(() => setCopied(false), 2500);
  };
  const doBroadcast = () => { const id = onBroadcast({ type, people, med: withMed, flags: flagCodes, lang: langMeta.tag }); setSent(id); };

  const box = term ? "border border-amber-400" : "rounded-lg border border-[var(--line)] bg-[var(--panel-2)]";
  const lab = term ? "mb-1.5 text-xs uppercase" : "mb-1.5 text-xs font-medium uppercase tracking-wider text-[var(--muted)]";

  return (
    <div className="fixed inset-0 z-[75] flex justify-end bg-black/60" onMouseDown={(e) => e.target === e.currentTarget && onClose()} role="dialog" aria-modal="true" aria-label="SOS and need help">
      <aside className={"drawer flex h-full w-full flex-col overflow-y-auto sm:max-w-[460px] " + (term ? "bg-black font-mono text-amber-400" : "border-l border-[var(--line)] bg-[var(--panel)]")} style={{ paddingTop: "env(safe-area-inset-top, 0px)", paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className={"flex items-center justify-between gap-3 px-4 py-3 " + (term ? "border-b border-amber-400" : "border-b border-[var(--line)]")}>
          <div className="flex items-center gap-2">
            {!term && <span className="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--sos)] text-white"><Icon name="siren" size={17} /></span>}
            <div>
              <h2 className={term ? "font-semibold" : "font-display text-lg font-semibold leading-tight"}>{term ? "SOS / NEED HELP" : "SOS · Need help"}</h2>
              <p className={term ? "text-xs" : "text-xs text-[var(--muted)]"}>{region.short}, {region.state} · GPS {region.coords.txt}</p>
            </div>
          </div>
          <button onClick={onClose} aria-label="Close SOS panel" className="p-1"><Icon name="x" size={20} /></button>
        </div>

        <div className="grid gap-5 p-4">
          <section>
            <div className={lab}>1 · Emergency type</div>
            <div className="grid grid-cols-2 gap-2">
              {TYPES.map((x) => (
                <button key={x.id} onClick={() => setType(x.id)} aria-pressed={type === x.id}
                  className={term ? "border px-2 py-2 text-left text-sm " + (type === x.id ? "border-amber-400 bg-amber-400 text-black" : "border-amber-400/40") : "flex items-center gap-2 rounded-md border px-3 py-2.5 text-left text-sm font-medium " + (type === x.id ? "border-[var(--sos)] bg-[var(--sos)]/15 text-white" : "border-[var(--line)] text-[var(--muted)] hover:text-[var(--text)]")}>
                  {!term && <Icon name={x.icon} size={16} />}{x.label}
                </button>
              ))}
            </div>
          </section>

          <section className="grid grid-cols-2 gap-4">
            <div>
              <div className={lab}>2 · People</div>
              <div className={"flex items-center justify-between " + (term ? "border border-amber-400" : "rounded-md border border-[var(--line)]")}>
                <button aria-label="Fewer people" onClick={() => setPeople((p) => Math.max(1, p - 1))} className="px-3 py-2.5"><Icon name="minus" size={16} /></button>
                <span className="tnum text-lg font-semibold" aria-live="polite">{people}</span>
                <button aria-label="More people" onClick={() => setPeople((p) => Math.min(99, p + 1))} className="px-3 py-2.5"><Icon name="plus" size={16} /></button>
              </div>
            </div>
            <div>
              <div className={lab}>Medical need</div>
              <button onClick={() => setMed(!withMed || type === "MED" ? true : false)} disabled={type === "MED"} aria-pressed={withMed}
                className={term ? "w-full border px-2 py-2.5 text-sm " + (withMed ? "bg-amber-400 text-black" : "border-amber-400/40") : "flex w-full items-center justify-center gap-2 rounded-md border px-2 py-2.5 text-sm " + (withMed ? "border-red-400/60 bg-red-500/15 text-red-200" : "border-[var(--line)] text-[var(--muted)]")}>
                {withMed ? "Yes, injured / ill" : "No"}
              </button>
            </div>
          </section>

          <section>
            <div className={lab}>3 · Who needs extra help? (tap all that apply)</div>
            <div className="flex flex-wrap gap-2">
              {FLAGS.map((f) => {
                const on = flags.includes(f.id);
                return (
                  <button key={f.id} onClick={() => toggleFlag(f.id)} aria-pressed={on}
                    className={term ? "border px-2.5 py-1.5 text-sm " + (on ? "bg-amber-400 text-black" : "border-amber-400/40") : "flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm " + (on ? "border-amber-400 bg-amber-400/15 font-semibold text-amber-200" : "border-[var(--line)] text-[var(--muted)] hover:text-[var(--text)]")}>
                    {!term && on && <Icon name="check" size={13} />}{f.label}
                  </button>
                );
              })}
            </div>
          </section>

          <section>
            <div className={lab}>4 · Language</div>
            <div className="flex flex-wrap gap-2">
              {LANGS.map((l) => (
                <button key={l.id} onClick={() => setLang(l.id)} aria-pressed={lang === l.id}
                  className={term ? "border px-2.5 py-1.5 text-sm " + (lang === l.id ? "bg-amber-400 text-black" : "border-amber-400/40") : "rounded-full border px-3 py-1.5 text-sm " + (lang === l.id ? "border-[var(--teal)] bg-[var(--teal)] font-semibold text-[#06201e]" : "border-[var(--line)] text-[var(--muted)]")}>
                  {l.native}{l.native !== l.label ? " · " + l.label : ""}
                </button>
              ))}
            </div>
          </section>

          <section>
            <div className={lab}>Emergency card · {langMeta.label}</div>
            <div className={box + " p-4"}>
              <div className={term ? "text-base font-semibold" : "text-center text-lg font-bold tracking-wide text-[var(--sos)]"}>{P.head}</div>
              <p className="mt-3 text-[17px] leading-snug" lang={lang === "kh" ? "en" : lang}>{P[type]}</p>
              <dl className={"mt-3 grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-sm " + (term ? "" : "text-[var(--muted)]")}>
                <dt>{P.ppl}</dt><dd className="tnum font-semibold">{people}</dd>
                <dt>{P.loc}</dt><dd className="font-semibold">{region.short} · {region.coords.txt}</dd>
                {withMed && <><dt>+</dt><dd className="font-semibold">{P.med}</dd></>}
                {flagLabels.length > 0 && <><dt>Needs</dt><dd className="font-semibold">{flagLabels.join(", ")}</dd></>}
              </dl>
              <p className={"mt-3 text-xs " + (term ? "" : "text-[var(--muted)]")}>{P.show}</p>
              {lang !== "en" && <p className={"mt-2 border-t pt-2 text-xs " + (term ? "border-amber-400/40" : "border-[var(--line)] text-[var(--muted)]")}>For responders (English): {PHRASE.en[type]} {people} {people === 1 ? "person" : "people"}{withMed ? ", medical need" : ""}{flagLabels.length ? ". Needs: " + flagLabels.join(", ") : ""}.</p>}
              {lang === "kh" && <p className="mt-2 text-xs text-amber-300">Khasi text is a draft mix of Khasi and English. Have a local speaker check it before field use.</p>}
            </div>
          </section>

          <section>
            <div className={lab}>Compressed SMS payload</div>
            <input ref={smsRef} readOnly value={sms} aria-label="SMS payload" onFocus={(e) => e.target.select()}
              className={"w-full px-3 py-2.5 font-mono text-sm " + (term ? "border border-amber-400 bg-black text-amber-300" : "rounded-md border border-[var(--line)] bg-black/40 text-[var(--teal)]")} />
            <div className="mt-2 flex items-center justify-between gap-3">
              <span className="tnum text-xs text-[var(--muted)]">{sms.length} of 160 characters · GPS stamped</span>
              <div className="flex flex-wrap justify-end gap-2">
              <button onClick={() => setShowQr(!showQr)} aria-pressed={showQr} className={term ? "border border-amber-400 px-3 py-1.5 text-sm " + (showQr ? "bg-amber-400 text-black" : "") : "flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-sm font-medium " + (showQr ? "border-white bg-white text-black" : "border-white/40 text-white hover:bg-white hover:text-black")}>
                <Icon name="qr" size={14} />{showQr ? "Hide QR" : "Show Offline Rescue QR"}
              </button>
              <button onClick={doCopy} className={term ? "border border-amber-400 px-3 py-1.5 text-sm" : "flex items-center gap-1.5 rounded-md border border-[var(--teal)] px-3 py-1.5 text-sm font-medium text-[var(--teal)] hover:bg-[var(--teal)] hover:text-[#06201e]"}>
                <Icon name={copied === true ? "check" : "copy"} size={14} />{copied === true ? "Copied" : copied === "manual" ? "Selected, press copy" : "Copy for SMS"}
              </button>
              </div>
            </div>
            {showQr && <QrCard qr={qr} sms={sms} term={term} />}
            <p className="mt-2 text-xs text-[var(--muted)]">Paste into any SMS app and send to your district control room. Works on 2G with no data.</p>
          </section>

          {sent ? (
            <div className={box + " p-4"}>
              <div className="flex items-center gap-2 font-semibold text-emerald-300"><Icon name="check" size={16} />Broadcast to local responders · {sent}</div>
              <p className="mt-1 text-sm text-[var(--muted)]">Your request is now live in the Responder Triage Feed for {region.short}.</p>
              <div className="mt-3 flex gap-2">
                <button onClick={onViewFeed} className={term ? "border border-amber-400 px-3 py-1.5 text-sm" : "rounded-md bg-[var(--teal)] px-3 py-2 text-sm font-semibold text-[#06201e]"}>View in responder feed</button>
                <button onClick={() => setSent(null)} className={term ? "border border-amber-400/50 px-3 py-1.5 text-sm" : "rounded-md border border-[var(--line)] px-3 py-2 text-sm text-[var(--muted)]"}>Send another</button>
              </div>
            </div>
          ) : (
            <button onClick={doBroadcast} className={term ? "border-2 border-amber-400 bg-amber-400 px-3 py-3 font-semibold text-black" : "pulse-sos flex items-center justify-center gap-2 rounded-lg bg-[var(--sos)] px-4 py-3.5 text-base font-semibold text-white hover:brightness-110"}>
              {!term && <Icon name="radio" size={18} />}{term ? "[BROADCAST TO LOCAL RESPONDERS]" : "Broadcast to local responders"}
            </button>
          )}
        </div>
      </aside>
    </div>
  );
}

        <h3 className={"mb-2 mt-6 text-xs font-semibold uppercase tracking-wider " + (term ? "" : "text-[var(--teal)]")}>NEEV's 3-layer offline-first architecture</h3>
        <ol className="grid gap-0">

                {i < layers.length - 1 && <span className={"mt-1 w-px flex-1 " + (term ? "bg-amber-400/60" : "bg-[var(--line)]")} />}
              </div>
              <div className={card + " min-w-0 flex-1"}>
                <div className="text-xs font-semibold uppercase tracking-wider opacity-70">Layer {i + 1}</div>

                <p className={"mt-1 text-sm leading-relaxed " + sub}>{b}</p>

        </ol>

        <div className={"mt-5 flex flex-wrap items-center gap-x-2 gap-y-1.5 text-sm " + (term ? "" : "")}>
          {["Citizen phone", "SMS or offline QR", "Responder triage feed", "Dispatch"].map((s, i, a) => (
            <React.Fragment key={s}>
              <span className={term ? "border border-amber-400 px-2 py-1" : "rounded border border-[var(--line)] bg-[var(--panel-2)] px-2.5 py-1 font-medium"}>{s}</span>

            </React.Fragment>
          ))}

/* ---------- App ---------- */
function App() {
  const [regionId, setRegionId] = useState("ghy");
  const [term, setTerm] = useState(false);
  const [tab, setTab] = useState("camps");
  const [sosOpen, setSosOpen] = useState(false);
  const [reportOpen, setReportOpen] = useState(false);
  const [impactOpen, setImpactOpen] = useState(false);
  const [hubFilter, setHubFilter] = useState("all");
  const [alert, setAlert] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [, setTick] = useState(0);
  const [battery, setBattery] = useState(null);
  const idRef = useRef(1040);

  const [camps, setCamps] = useState(() => Object.fromEntries(REGIONS.map((r) => [r.id, r.camps.map((c) => ({ ...c, feats: CAMP_FEATS[c.id] || [] }))])));
  const [chokes, setChokes] = useState(() => Object.fromEntries(REGIONS.map((r) => [r.id, r.chokes.map((c) => ({ ...c, ts: t(c.ver) }))])));
  const [levels, setLevels] = useState(() => Object.fromEntries(REGIONS.map((r) => [r.id, r.level])));
  const [log, setLog] = useState([]);
  const [triage, setTriage] = useState(() => REGIONS.flatMap((r) => r.triage.map((i) => ({ ...i, regionId: r.id }))));

  const region = REGIONS.find((r) => r.id === regionId);
  const level = levels[regionId];
  const speech = useSpeech(region);

  useEffect(() => { const i = setInterval(() => setTick((x) => x + 1), 30000); return () => clearInterval(i); }, []);
  useEffect(() => { document.documentElement.setAttribute("data-mode", term ? "term" : "std"); }, [term]);
  useEffect(() => {
    try { if (navigator.getBattery) navigator.getBattery().then((b) => setBattery(Math.round(b.level * 100))).catch(() => {}); } catch (e) {}
  }, []);

  const toast = useCallback((msg) => {
    const id = Math.random();
    setToasts((x) => [...x, { id, msg }]);
    setTimeout(() => setToasts((x) => x.filter((y) => y.id !== id)), 3600);
  }, []);

  const addTriage = (item) => {
    const id = "R-" + ++idRef.current;
    setTriage((x) => [{ ...item, id, ts: Date.now(), status: "NEW", fresh: true }, ...x]);
    return id;
  };

  const onReserve = (c) => {
    const code = "NV-" + String(Math.floor(1000 + Math.random() * 9000));
    setCamps((all) => ({ ...all, [regionId]: all[regionId].map((x) => x.id === c.id ? { ...x, beds: [x.beds[0] + 1, x.beds[1]], reserved: code } : x) }));
    addTriage({ regionId, type: "PICKUP", people: 1, med: false, loc: region.coords.txt, source: "CAMP", campName: c.name });
    toast((KIND[c.kind].act) + " confirmed at " + c.name + " · " + code);
  };

  const onBroadcast = ({ type, people, med, flags, lang }) => {
    const id = addTriage({ regionId, type, people, med, flags, lang, loc: region.coords.txt, source: "SOS" });
    toast("SOS broadcast to " + region.short + " responders");
    return id;
  };

  const onAdvance = (id) => {
    setTriage((all) => all.map((i) => (i.id === id && NEXT[i.status] ? { ...i, status: NEXT[i.status][0], fresh: false } : i)));
  };

  const onReportSubmit = ({ target, newName, status, note, by }) => {
    const now = Date.now();
    let name;
    setChokes((all) => {
      const list = all[regionId];
      if (target === "__new") {
        name = newName;
        return { ...all, [regionId]: [{ id: "n" + now, name: newName, note: note || "Reported from the ground.", status, ts: now, by, reports: 1 }, ...list] };
      }
      return { ...all, [regionId]: list.map((c) => { if (c.id !== target) return c; name = c.name; return { ...c, status, ts: now, by, note: note || c.note, reports: c.reports + 1 }; }) };
    });
    setTimeout(() => {
      setLog((l) => [{ id: now, name: name || newName, status, note, by, ts: now }, ...l]);
    }, 0);
    setReportOpen(false);
    toast("Update published · feed refreshed");
  };

  const simulate = () => {
    const a = region.alert;
    setAlert({ ...a, regionId, ts: Date.now() });
    setLevels((l) => ({ ...l, [regionId]: "RED" }));
    playSiren();
    const eff = a.effect;
    const now = Date.now();
    setChokes((all) => ({ ...all, [regionId]: all[regionId].map((c) => c.id === eff.chokeId ? { ...c, status: eff.status, note: eff.note, ts: now, by: "Auto advisory", reports: c.reports + 1 } : c) }));
    const cn = chokes[regionId].find((c) => c.id === eff.chokeId);
    setLog((l) => [{ id: now, name: cn ? cn.name : "Highway", status: eff.status, note: eff.note, by: "Auto advisory", ts: now }, ...l]);
  };

  const switchRegion = (id) => { setRegionId(id); if (alert && alert.regionId !== id) setAlert(null); };
  const showRoutes = () => { setTab(term ? "roads" : "chokes"); setAlert(null); };
  const showFeed = () => { setSosOpen(false); setTab("triage"); };

  const campsHere = camps[regionId];
  const chokesHere = chokes[regionId];
  const openCamps = campsHere.filter((c) => c.beds[1] - c.beds[0] > 0).length;
  const termTab = tab === "chokes" ? "roads" : tab;
  const stdTab = tab === "roads" ? "chokes" : tab;
  const levelTone = level === "RED" ? "border-red-500/50 bg-red-500/15 text-red-300" : "border-amber-500/50 bg-amber-500/15 text-amber-300";

  return (
    <div className="min-h-screen">
      {/* Header */}
      <header className={"sticky-top z-50 -mx-4 px-4 " + (term ? "border-b border-amber-400 bg-black" : "border-b border-[var(--line)] bg-[var(--ink)]/95 backdrop-blur")} style={{ marginLeft: "calc(-1 * max(16px, env(safe-area-inset-left, 0px)))", marginRight: "calc(-1 * max(16px, env(safe-area-inset-right, 0px)))", paddingLeft: "max(16px, env(safe-area-inset-left, 0px))", paddingRight: "max(16px, env(safe-area-inset-right, 0px))" }}>
        <div className="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-2 py-2.5">
          <div className="mr-auto min-w-0">
            <div className={term ? "font-mono text-base font-semibold" : "font-display text-xl font-bold leading-none tracking-wide"}>NEEV</div>
            <div className={"hidden text-[11px] sm:block " + (term ? "font-mono" : "text-[var(--muted)]")}>North-East Emergency &amp; Evacuation Grid</div>
          </div>

          <label className="order-3 w-full min-w-0 sm:order-none sm:w-auto sm:min-w-[280px]">
            <span className="sr-only">Region</span>
            <select value={regionId} onChange={(e) => switchRegion(e.target.value)} className={"w-full px-2.5 py-2 text-sm " + (term ? "border border-amber-400 bg-black font-mono text-amber-400" : "rounded-md border border-[var(--line)] bg-[var(--panel)]")}>
              {REGIONS.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </label>

          <button role="switch" aria-checked={term} onClick={() => { setTerm(!term); setTab(term ? "camps" : "camps"); }} className={"flex items-center gap-2 px-2 py-1.5 text-xs " + (term ? "border border-amber-400 font-mono" : "rounded-md border border-[var(--line)] bg-[var(--panel)]")}>
            <span className={term ? "" : "text-[var(--muted)]"}>Standard</span>
            <span className={"relative inline-block h-5 w-9 shrink-0 rounded-full " + (term ? "bg-amber-400" : "bg-white/15")}>
              <span className={"absolute top-0.5 h-4 w-4 rounded-full " + (term ? "left-[18px] bg-black" : "left-0.5 bg-white")} />
            </span>
            <span className={term ? "font-semibold" : "text-[var(--muted)]"}>2G / Low-Battery Offline</span>
          </button>

          <button onClick={simulate} className={"text-xs underline-offset-2 hover:underline " + (term ? "font-mono" : "text-[var(--muted)] hover:text-[var(--text)]")} title="Demo helper">
            Simulate live alert
          </button>

          <button onClick={() => setImpactOpen(true)} className={"flex items-center gap-1.5 text-xs " + (term ? "border border-amber-400 px-2 py-1.5 font-mono" : "rounded-md border border-[var(--line)] px-2.5 py-1.5 text-[var(--muted)] hover:text-[var(--text)]")}>
            <Icon name="info" size={14} />About / Impact
          </button>

          <button onClick={() => setSosOpen(true)} className={term ? "border-2 border-amber-400 bg-amber-400 px-3 py-1.5 font-mono font-semibold text-black" : "pulse-sos flex items-center gap-1.5 rounded-md bg-[var(--sos)] px-4 py-2 text-sm font-bold tracking-wide text-white hover:brightness-110"}>
            {!term && <Icon name="siren" size={16} />}{term ? "[SOS]" : "SOS / NEED HELP"}
          </button>
        </div>
      </header>

      {term ? (
        <Terminal region={region} camps={campsHere} chokes={chokesHere} tab={termTab} setTab={setTab} level={level} alert={alert && alert.regionId === regionId ? alert : null}
          helplines={HELPLINES} onReserve={onReserve} onReport={() => setReportOpen(true)} onOpenSos={() => setSosOpen(true)} triage={triage} onAdvance={onAdvance}
          onAck={() => setAlert(null)} onRoutes={showRoutes} battery={battery} filter={hubFilter} setFilter={setHubFilter} speech={speech} />
      ) : (
        <main className="mx-auto max-w-6xl pb-32 pt-4">
          <AlertBanner alert={alert && alert.regionId === regionId ? alert : null} onAck={() => setAlert(null)} onRoutes={showRoutes} speech={speech} />

          {/* Situation strip */}
          <section className="mb-5 grid gap-5 rounded-lg border border-[var(--line)] bg-[var(--panel)] p-4 md:grid-cols-[1fr_auto]">
            <div className="min-w-0">
              <div className="flex flex-wrap items-center gap-2">
                <span className={"rounded border px-2 py-0.5 text-[11px] font-bold tracking-wider " + levelTone}>{level} ALERT</span>
                <span className="text-xs text-[var(--muted)]">{region.state} · {region.hazard}</span>
              </div>
              <h1 className="mt-2 font-display text-2xl font-semibold leading-tight">{region.short}: what is happening now</h1>
              <p className="mt-2 max-w-2xl text-[15px] leading-relaxed text-[var(--muted)]">{region.advisory}</p>
              <ListenButton speech={speech} className="mt-3 rounded-md border border-[var(--teal)] px-3 py-1.5 text-sm font-medium text-[var(--teal)] hover:bg-[var(--teal)] hover:text-[#06201e]" />
              <dl className="mt-4 flex flex-wrap gap-x-8 gap-y-3 text-sm">
                <div><dt className="text-xs text-[var(--muted)]">Rain, last 24 h</dt><dd className="tnum font-display text-lg font-semibold">{region.rain24} mm</dd></div>
                <div><dt className="text-xs text-[var(--muted)]">{region.gauge.label}</dt><dd className="tnum font-display text-lg font-semibold">{region.gauge.now} {region.gauge.unit} <span className="text-xs font-normal text-[var(--muted)]">danger {region.gauge.danger}</span></dd></div>
                <div><dt className="text-xs text-[var(--muted)]">Shelters with space</dt><dd className="tnum font-display text-lg font-semibold">{openCamps} of {campsHere.length}</dd></div>
              </dl>
            </div>
            <div className="flex items-end"><RainChart data={region.rain} /></div>
          </section>

          {/* Tabs */}
          <div className="scroll-x mb-4 border-b border-[var(--line)]" role="tablist">
            <div className="flex min-w-max gap-1">
              {[["camps", "tent", "Relief Camps & Boat/Rescue Points"], ["chokes", "route", "Highway & Terrain Chokepoints"], ["triage", "radio", "Responder Triage Feed"]].map(([id, ic, l]) => (
                <button key={id} role="tab" aria-selected={stdTab === id} onClick={() => setTab(id)}
                  className={"flex items-center gap-2 border-b-2 px-3.5 py-2.5 text-sm font-medium " + (stdTab === id ? "border-[var(--teal)] text-[var(--text)]" : "border-transparent text-[var(--muted)] hover:text-[var(--text)]")}>
                  <Icon name={ic} size={15} />{l}
                  {id === "triage" && <span className="tnum rounded bg-white/10 px-1.5 text-xs">{triage.filter((i) => i.regionId === regionId && i.status === "NEW").length}</span>}
                </button>
              ))}
            </div>
          </div>

          {stdTab === "camps" && <CampsTab camps={campsHere} onReserve={onReserve} filter={hubFilter} setFilter={setHubFilter} />}
          {stdTab === "chokes" && <ChokesTab chokes={chokesHere} log={log} onReport={() => setReportOpen(true)} />}
          {stdTab === "triage" && <TriageTab items={triage} regionId={regionId} onAdvance={onAdvance} />}

          <section className="mt-8 grid gap-3 border-t border-[var(--line)] pt-5 sm:grid-cols-[auto_1fr] sm:items-center">
            <div className="flex flex-wrap gap-x-5 gap-y-1">
              {HELPLINES.map((h) => <span key={h.n} className="flex items-center gap-1.5 text-sm"><Icon name="phone" size={13} className="text-[var(--teal)]" /><span className="tnum font-semibold">{h.n}</span><span className="text-xs text-[var(--muted)]">{h.l}</span></span>)}
            </div>
            <p className="text-xs text-[var(--muted)] sm:text-right">Demo build. Camp numbers, reports and alerts are illustrative, not official. Call 112 in a real emergency.</p>
          </section>
        </main>
      )}

      {/* Floating SOS on small screens */}
      {!sosOpen && (
        <button onClick={() => setSosOpen(true)} aria-label="SOS, need help"
          className={"fixed z-40 sm:hidden " + (term ? "border-2 border-amber-400 bg-amber-400 px-4 py-3 font-mono font-bold text-black" : "pulse-sos flex items-center gap-2 rounded-full bg-[var(--sos)] px-5 py-3.5 font-bold text-white shadow-xl")}
          style={{ right: "max(16px, env(safe-area-inset-right, 0px))", bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>
          {!term && <Icon name="siren" size={18} />}SOS
        </button>
      )}

      {sosOpen && <SosPanel region={region} term={term} onClose={() => setSosOpen(false)} onBroadcast={onBroadcast} onViewFeed={showFeed} />}
      {impactOpen && <ImpactModal term={term} onClose={() => setImpactOpen(false)} />}
      {reportOpen && <ReportModal chokes={chokesHere} term={term} onClose={() => setReportOpen(false)} onSubmit={onReportSubmit} />}
      <Toasts items={toasts} term={term} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body></html>
